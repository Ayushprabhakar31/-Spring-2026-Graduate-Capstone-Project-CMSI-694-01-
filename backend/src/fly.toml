app = "pulseops-ayush-backend"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  HOST = "0.0.0.0"
  DB_PATH = "/data/pulseops.db"
  ENABLE_REDIS = "false"
  OPENAI_MODEL = "gpt-5-mini"
  PUBLIC_BASE_URL = "https://pulseops-ayush-backend.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 200

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/health"

[[mounts]]
  source = "pulseops_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
